name: Build Production and Deploy to Cloudflare Pages

on:
    push:
      tags:
      - production_v*
    # Manual re-run of an EXISTING production tag. Added because a tag push was
    # the only way to start this workflow, so a failed deploy could only be
    # retried by deleting and re-pushing the tag — which the release-publish-tag
    # skill explicitly forbids. It also gives release automation a deterministic
    # fallback if a tag push ever fails to cascade.
    #
    # This does NOT create or move a tag. `version` must name a tag that already
    # exists, and the guard job below refuses anything else, so a dispatch can
    # never deploy an untagged commit to production.
    workflow_dispatch:
      inputs:
        version:
          description: 'Existing production tag to deploy, e.g. production_v20260908_0'
          required: true
          type: string

concurrency:
    # Cancel-on-supersede, deliberately kept as-is now that a dispatch can also
    # enter this group. A dispatched re-deploy of a tag whose push-triggered
    # build is still running WILL cancel that build.
    #
    # That is safe here in a way it would not be for a store build: a Cloudflare
    # Pages deployment is only promoted once it finishes, so a cancelled run
    # leaves production serving the previous version rather than a half-applied
    # one. Compare the mobile app's production_build.yml, which queues instead
    # (cancel-in-progress: false) because a cancelled Shorebird release cannot
    # be re-registered.
    #
    # The cost is that the cancelled run never reaches send_slack_notification,
    # so the tag ends up published with no deploy announcement. If a re-deploy
    # cancels a live one, watch the surviving run to completion rather than
    # assuming the tag shipped.
    group: cloudflare-pages-build-production
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Runs on BOTH paths, and not only for `needs` uniformity: the push trigger
    # above is the glob `production_v*`, while this job enforces the strict
    # `production_v[0-9]{8}_[0-9]+`. Those are not the same set. Pushing this
    # repo's malformed historical tag `production_v202505012_1` matches the glob
    # and would start a production deploy; this job is what refuses it.
    #
    # So do not gate these steps on `github.event_name == 'workflow_dispatch'`,
    # and do not shallow the checkout below: `git rev-parse refs/tags/...` and
    # `git rev-list -n1` need the tag and its commit present, and a depth-1
    # fetch of a dispatch's default-branch ref is not guaranteed to contain
    # them. A few seconds of clone is the price of the guard being real.
    validate_version:
        name: Validate the requested tag
        runs-on: ubuntu-latest
        steps:
            - name: Checkout with tags
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Refuse anything that is not an existing production tag
              env:
                VERSION: ${{ inputs.version || github.ref_name }}
              run: |
                set -euo pipefail
                # Strictly 8 digits: this repo carries a malformed historical tag
                # (production_v202505012_1) that a looser pattern would accept.
                if ! printf '%s' "$VERSION" | grep -Eq '^production_v[0-9]{8}_[0-9]+$'; then
                  echo "::error::'$VERSION' is not a production tag (expected production_vYYYYMMDD_N)."
                  exit 1
                fi
                if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                  echo "::error::Tag '$VERSION' does not exist. This workflow deploys an existing tag; it never creates one."
                  exit 1
                fi
                echo "Deploying existing tag $VERSION ($(git rev-list -n1 "$VERSION"))."

    build_to_cloudflare_pages:
        needs: [validate_version]
        timeout-minutes: 30
        runs-on: ubuntu-latest
        environment: Production
        env: 
          VERSION: ${{ inputs.version || github.ref_name }}
        steps:
            # Pinned to the tag rather than the triggering ref: on a dispatch the
            # ref is the default branch, and building main while labelling the
            # artifact with a tag would ship untagged code as that release.
            - name: Checkout the tagged commit
              uses: actions/checkout@v4
              with:
                ref: ${{ inputs.version || github.ref_name }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v2
              with:
                version: 9
                run_install: false

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Debug TypeScript version
              run: pnpm exec tsc --version

            # Must run BEFORE next build / next-on-pages so the file is copied from
            # public/ into the static output and registered in the worker's static
            # asset manifest. Writing it after postbuild leaves it invisible to the
            # worker, which then 404s /app-info.json as an unknown Next route.
            - name: Generate app-info.json
              uses: "deriv-com/shared-actions/.github/actions/generate_app_info@master"
              with:
                version: ${{ inputs.version || github.ref_name }}
                output_dir: public

            - name: Build
              run: pnpm run build && pnpm run postbuild
              env:
                NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
                NEXT_PUBLIC_CORE_URL: ${{ vars.NEXT_PUBLIC_CORE_URL }}
                NEXT_PUBLIC_CORE_ME_URL: ${{ vars.NEXT_PUBLIC_CORE_ME_URL }}
                NEXT_PUBLIC_CORE_BE_URL: ${{ vars.NEXT_PUBLIC_CORE_BE_URL }}
                NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL }}
                NEXT_PUBLIC_SOCKET_ME_URL: ${{ vars.NEXT_PUBLIC_SOCKET_ME_URL }}
                NEXT_PUBLIC_SOCKET_BE_URL: ${{ vars.NEXT_PUBLIC_SOCKET_BE_URL }}
                NEXT_PUBLIC_CASHIER_URL: ${{ vars.NEXT_PUBLIC_CASHIER_URL }}
                NEXT_PUBLIC_DATA_SOURCE: ${{ vars.NEXT_PUBLIC_DATA_SOURCE }}
                NEXT_PUBLIC_DATADOG_APPLICATION_ID: ${{ vars.NEXT_PUBLIC_DATADOG_APPLICATION_ID }}
                NEXT_PUBLIC_DATADOG_CLIENT_TOKEN: ${{ vars.NEXT_PUBLIC_DATADOG_CLIENT_TOKEN }}
                NEXT_PUBLIC_DATADOG_ENV: ${{ vars.NEXT_PUBLIC_DATADOG_ENV }}
                NEXT_PUBLIC_DATADOG_SERVICE: ${{ vars.NEXT_PUBLIC_DATADOG_SERVICE }}
                NEXT_PUBLIC_DATADOG_SESSION_REPLAY_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_DATADOG_SESSION_REPLAY_SAMPLE_RATE }}
                NEXT_PUBLIC_DATADOG_SESSION_SAMPLE_RATE: ${{ vars.NEXT_PUBLIC_DATADOG_SESSION_SAMPLE_RATE }}
                NEXT_PUBLIC_DATADOG_VERSION: ${{ vars.NEXT_PUBLIC_DATADOG_VERSION }}
                NEXT_PUBLIC_BRANCH: ${{ vars.NEXT_PUBLIC_BRANCH }}
                NEXT_PUBLIC_NOTIFICATION_APPLICATION_ID: ${{ vars.NEXT_PUBLIC_NOTIFICATION_APPLICATION_ID }}
                NEXT_PUBLIC_NOTIFICATION_URL: ${{ vars.NEXT_PUBLIC_NOTIFICATION_URL }}
                NEXT_PUBLIC_IS_ORY_ENABLED: ${{ vars.NEXT_PUBLIC_IS_ORY_ENABLED }}
                NEXT_PUBLIC_ORY_URL: ${{ vars.NEXT_PUBLIC_ORY_URL }}
                NEXT_PUBLIC_ORY_ME_URL: ${{ vars.NEXT_PUBLIC_ORY_ME_URL }}
                NEXT_PUBLIC_ORY_BE_URL: ${{ vars.NEXT_PUBLIC_ORY_BE_URL }}
                NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
                NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
                NEXT_PUBLIC_POSTHOG_ME_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_ME_HOST }}
                NEXT_PUBLIC_POSTHOG_BE_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_BE_HOST }}
                NEXT_PUBLIC_FLOATING_RATE_ENABLED: ${{ vars.NEXT_PUBLIC_FLOATING_RATE_ENABLED }}
                NEXT_PUBLIC_INTERCOM_APP_ID: ${{ vars.NEXT_PUBLIC_INTERCOM_APP_ID }}
                NEXT_PUBLIC_IS_CLOSED_GROUP_ENABLED: ${{ vars.NEXT_PUBLIC_IS_CLOSED_GROUP_ENABLED }}
                NEXT_PUBLIC_IS_AD_CONDITIONS_ENABLED: ${{ vars.NEXT_PUBLIC_IS_AD_CONDITIONS_ENABLED }}
                NEXT_PUBLIC_IS_TRANSFER_FEE_DISPLAY_ENABLED: ${{ vars.NEXT_PUBLIC_IS_TRANSFER_FEE_DISPLAY_ENABLED }}
                NEXT_PUBLIC_CLIENT_URL: ${{ vars.NEXT_PUBLIC_CLIENT_URL }}
                NEXT_PUBLIC_IS_KYC_MANDATORY: ${{ vars.NEXT_PUBLIC_IS_KYC_MANDATORY }}
                NEXT_PUBLIC_RELEASE_TAG: ${{ inputs.version || github.ref_name }}
                # Must match generate_app_info `version` above so analytics
                # event_metadata.app_version correlates with /app-info.json.
                NEXT_PUBLIC_APP_VERSION: ${{ inputs.version || github.ref_name }}
                NEXT_PUBLIC_P2P_WHATS_NEW_ENABLED: ${{ vars.NEXT_PUBLIC_P2P_WHATS_NEW_ENABLED }}
                NEXT_PUBLIC_P2P_WHATS_COMING_TAG: ${{ vars.NEXT_PUBLIC_P2P_WHATS_COMING_TAG }}
                NEXT_PUBLIC_P2P_SYSTEM_MAINTENANCE_ENABLED: ${{ vars.NEXT_PUBLIC_P2P_SYSTEM_MAINTENANCE_ENABLED }}
                NEXT_PUBLIC_P2P_ORDER_CHAT_MODERATION_ENABLED: ${{ vars.NEXT_PUBLIC_P2P_ORDER_CHAT_MODERATION_ENABLED }}
                NEXT_PUBLIC_IS_PAYMENT_METHOD_SESSION_ELEVATION_ENABLED: ${{ vars.NEXT_PUBLIC_IS_PAYMENT_METHOD_SESSION_ELEVATION_ENABLED }}
                NEXT_PUBLIC_NODE_ENV: production
                NODE_ENV: production

            - name: Replace placeholders in wrangler.toml
              run: |
                sed -i "s/PROJECT_NAME/${{ secrets.CLOUDFLARE_PROJECT_NAME }}/g" wrangler.toml
              shell: bash

            - name: Publish to Cloudflare Pages
              uses: "deriv-com/shared-actions/.github/actions/publish_to_pages_branch@master"
              id: publish_to_cloudflare
              with:
                CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                project_name: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
                branch_name: master
                output_dir: .vercel/output/static
                directory: dist
                cname_url: dp2p.deriv.com

    send_slack_notification:
        name: Send Release Slack notification
        environment: Production
        runs-on: ubuntu-latest
        # `always()` so a genuinely FAILED deploy still announces itself, but
        # NOT when the build was skipped. A skip means validate_version refused
        # the input, so nothing was built and nothing was deployed -- announcing
        # "deployment has failed" for a release that never started would page
        # the channel over a typo. The red run in Actions is the right signal
        # there, and it is what the dispatcher (or Lexi's poller) already reads.
        if: always() && needs.build_to_cloudflare_pages.result != 'skipped'
        needs: [build_to_cloudflare_pages]
        steps:
            - name: Send Slack Notification
              env:
                SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                VERSION: ${{ inputs.version || github.ref_name }}
                RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.version || github.ref_name }}
                WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                BUILD_RESULT: ${{ needs.build_to_cloudflare_pages.result }}
              run: |
                if [[ "$BUILD_RESULT" == 'success' ]]; then
                  STATUS="✅ SUCCESS"
                  MESSAGE="P2P v2 frontend release $VERSION has been successfully deployed to production (dp2p.deriv.com)"
                else
                  STATUS="❌ FAILED"
                  MESSAGE="P2P v2 frontend release $VERSION deployment to production has failed"
                fi

                PAYLOAD=$(jq -n \
                  --arg status "$STATUS" \
                  --arg message "$MESSAGE" \
                  --arg version "$VERSION" \
                  --arg release_url "$RELEASE_URL" \
                  --arg workflow_url "$WORKFLOW_URL" \
                  '{status: $status, message: $message, version: $version, release_url: $release_url, workflow_url: $workflow_url}')

                if ! curl -X POST "$SLACK_WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d "$PAYLOAD"; then
                  echo "::warning::Failed to send Slack notification"
                fi
